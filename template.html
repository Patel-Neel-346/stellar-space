<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Stellar Garden</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#02030a>
<style>
/*FONTS*/
/* The class on <body> is the state of the page:
   l = loading, m = main menu, z = pause menu, g = in the scene (g p while the mouse is captured), l e = failed to start, q = farewell */
:root { --ink: #e9f1ff; --dim: #8fa4c4; --acc: #7fd0ff; --line: #7fd0ff33; --glass: #070d1ccc; }
html { background: #02030a; }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; background: #02030a;
  font: 500 clamp(13px, .6vw + .9vh, 30px)/1.4 Rajdhani, system-ui, sans-serif; color: var(--ink);
  -webkit-user-select: none; user-select: none;
}
@media (orientation: portrait) and (pointer: coarse) {
  body { width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
}
canvas { position: absolute; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: opacity 1.6s, filter .8s; }
.l canvas, .q canvas { opacity: 0; }
.z canvas { filter: brightness(.55) saturate(.8); }

#cp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
#hint { white-space: pre-line; line-height: 1.8; }
/* ---- menu layer */
#m { position: absolute; inset: 0; display: none; opacity: 0; transition: opacity .6s; pointer-events: none; }
.m #m, .z #m { display: block; opacity: 1; pointer-events: auto; }
#m::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #02030acc 0, #02030a66 38%, #0000 62%), radial-gradient(#0000 55%, #02030a99); pointer-events: none; }
.z #m::before { background: radial-gradient(#02030a66, #02030acc); }
#hd { position: absolute; left: 7vw; top: 8vh; }
h1 {
  margin: 0; font: 700 clamp(2.4em, 5.2vw, 8em)/.95 Rajdhani, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase;
  color: #0000; background: linear-gradient(180deg, #fff 30%, #9fd8ff 70%, #5aa7e0); -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 0 .45em #4aa8ff55) drop-shadow(0 .06em .15em #000a);
}
#sub { margin: .9em 0 0 .3em; font: 600 1.05em/1 Rajdhani, system-ui; letter-spacing: .5em; color: var(--acc); }
.z h1 { font-size: clamp(2em, 3.6vw, 6em); }
.z #sub { visibility: hidden; }
#nav { position: absolute; left: 7vw; top: 42vh; display: grid; gap: min(.5em, .9vh); width: 21em; }
.z #nav { top: 32vh; }
#nav button {
  position: relative; display: flex; align-items: center; justify-content: space-between; padding: min(.72em, 1.7vh) 1.3em; border: 0; border-left: 2px solid var(--line);
  background: linear-gradient(90deg, var(--glass), #070d1c55); backdrop-filter: blur(10px); border-radius: 0 .5em .5em 0;
  font: 600 1.18em/1 Rajdhani, system-ui; letter-spacing: .26em; text-transform: uppercase; color: var(--ink); cursor: pointer; text-align: left;
  transition: transform .18s, border-color .18s, background .18s, color .18s, padding .18s;
}
#nav button::after { content: "›"; opacity: 0; transform: translateX(-.6em); transition: .18s; color: var(--acc); font-size: 1.2em; }
#nav button:hover, #nav button:focus-visible { outline: 0; transform: translateX(.7em); border-color: var(--acc); background: linear-gradient(90deg, #12365c, #0b1d3a88); color: #fff; box-shadow: 0 0 1.6em #4aa8ff33; }
#nav button:hover::after, #nav button:focus-visible::after { opacity: 1; transform: none; }
#nav button:disabled { opacity: .35; pointer-events: none; }
#nav button.pri { border-left-color: var(--acc); }
#ver { position: absolute; left: 7vw; bottom: 4vh; font: 600 .8em/1 Rajdhani; letter-spacing: .3em; color: #8fa4c488; }
#hint { position: absolute; right: 4vw; bottom: 4vh; font: 600 .8em/1 Rajdhani; letter-spacing: .25em; color: #8fa4c4aa; text-align: right; }

/* ---- panels (settings, graphics, audio, saves, quit) */
#pn { position: absolute; inset: 0; display: none; place-items: center; background: #02030a88; backdrop-filter: blur(6px); }
#pn.on { display: grid; }
.card { width: min(46em, 92vw); max-height: 88vh; overflow: auto; padding: 1.8em 2.2em; border: 1px solid var(--line); border-radius: .8em; background: var(--glass); backdrop-filter: blur(18px); box-shadow: 0 2em 6em #000c, inset 0 0 3em #4aa8ff0d; }
.card h2 { margin: 0 0 1em; font: 700 1.5em/1 Rajdhani; letter-spacing: .3em; text-transform: uppercase; color: #fff; }
.card p { margin: 0 0 1.2em; color: var(--dim); }
.row { display: grid; grid-template-columns: 1fr 15em 3.2em; align-items: center; gap: 1em; padding: .55em 0; border-bottom: 1px solid #7fd0ff14; }
.row label { letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.row output { text-align: right; color: var(--acc); font-variant-numeric: tabular-nums; }
.row .sw { grid-column: 2 / 4; display: flex; gap: .3em; justify-content: flex-end; }
.row small { display: block; color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--acc); height: 1.6em; cursor: pointer; }
.seg { display: flex; gap: .25em; flex: 1; }
.seg button, .btns button {
  flex: 1; padding: .5em .7em; border: 1px solid var(--line); border-radius: .35em; background: #0a1730; color: var(--ink); font: 600 .95em/1 Rajdhani; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: .15s;
}
.seg button:hover, .btns button:hover { border-color: var(--acc); background: #12365c; }
.seg button.on { background: linear-gradient(#4aa8ff, #2b6fb8); color: #021022; border-color: #9fd8ff; }
.btns { display: flex; gap: .6em; justify-content: flex-end; margin-top: 1.5em; }
.btns button { flex: 0 0 auto; padding: .7em 1.4em; }
.btns .go { background: linear-gradient(#4aa8ff, #2b6fb8); color: #021022; border-color: #9fd8ff; }
.btns .bad { background: #5a1420; border-color: #ff7a8a66; }
#rs { display: none; margin-top: 1em; padding: .7em 1em; border-radius: .4em; background: #3a2a0a; color: #ffd68a; letter-spacing: .05em; }
#rs.on { display: block; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: .2em 1em; width: 100%; margin-bottom: .6em; padding: .8em 1.1em; border: 1px solid var(--line); border-radius: .4em; background: #0a1730; color: var(--ink); text-align: left; cursor: pointer; font: 600 1em/1.3 Rajdhani; letter-spacing: .1em; }
.slot:hover { border-color: var(--acc); background: #12365c; }
.slot:disabled { opacity: .4; pointer-events: none; }
.slot span { color: var(--dim); font-weight: 500; letter-spacing: .04em; }
.slot b { color: var(--acc); font-weight: 600; text-align: right; }

/* ---- loading */
#ld { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1em; transition: opacity .8s, visibility .8s; }
.m #ld, .z #ld, .g #ld, .q #ld { opacity: 0; visibility: hidden; }
#ld h1 { font-size: clamp(2em, 4.4vw, 6em); }
#p { width: 22em; max-width: 80vw; height: 3px; overflow: hidden; border-radius: 2px; background: #7fd0ff22; }
#b { display: block; height: 100%; background: linear-gradient(90deg, #4aa8ff, #cfeaff); transform: scaleX(0); transform-origin: 0; transition: transform .35s; }
#s { font: 600 .9em/1 Rajdhani; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
#w { color: var(--dim); font-size: .85em; letter-spacing: .08em; }
.e #p { visibility: hidden; }
.e #s { font-size: 1.1em; letter-spacing: 0; text-transform: none; color: #ff9aa6; max-width: 40em; text-align: center; }

/* ---- in the scene */
#hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
.g #hud { opacity: 1; }
#i { position: absolute; left: 2em; bottom: 2em; margin: 0; font: 600 1em/1.55 Rajdhani, system-ui; letter-spacing: .16em; white-space: pre-wrap; color: #cfe6ff; text-shadow: 0 0 .6em #0008, 0 1px 3px #000; }
#t { position: absolute; left: 0; right: 0; bottom: 16%; text-align: center; margin: 0; font: 600 1.15em Rajdhani; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 1px 6px #000, 0 0 14px #000; transition: opacity .4s; opacity: 0; }
#t.on { opacity: 1; }
#x { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; box-shadow: 0 0 0 1px #fff8, 0 0 8px #7fd0ff; opacity: 0; transition: opacity .5s; }
.p #x { opacity: .5; }
#rd { position: absolute; left: 50%; top: 11%; transform: translateX(-50%); width: min(44em, 80vw); margin: 0; text-align: center; font: 600 1.05em/1.35 Rajdhani; letter-spacing: .05em; color: #cfe6ff; text-shadow: 0 1px 6px #000, 0 0 12px #000; opacity: 0; transition: opacity .35s; }
#rd.on { opacity: 1; } #rd b { display: block; color: var(--acc); font-size: .8em; letter-spacing: .3em; text-transform: uppercase; }
#hf { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 14em 2em #ff2a1ccc; pointer-events: none; }
#o { position: absolute; top: .8em; right: .8em; display: none; padding: .35em .8em; border: 1px solid var(--line); border-radius: .4em; background: #070d1ccc; color: var(--ink); font: 600 1.1em Rajdhani; letter-spacing: .15em; cursor: pointer; pointer-events: auto; }
.g #o { display: block; }
.p #o { display: none; }
#wm { position: absolute; left: 0; right: 0; top: 18%; text-align: center; font: 600 1.1em Rajdhani; letter-spacing: .6em; color: #cfeaff; text-transform: uppercase; opacity: 0; transition: opacity .5s; text-shadow: 0 0 1em #4aa8ff; }
#wm.on { opacity: 1; }
#fw { position: absolute; inset: 0; display: none; place-content: center; text-align: center; background: #000; }
.q #fw { display: grid; }
#fw h1 { font-size: 3em; } #fw p { color: var(--dim); letter-spacing: .3em; }
#fw button { margin: 1.5em auto 0; padding: .7em 1.6em; border: 1px solid var(--line); border-radius: .4em; background: #0a1730; color: var(--ink); font: 600 1em Rajdhani; letter-spacing: .2em; cursor: pointer; }
@media (max-height: 520px) { #ver, #hint { display: none; } #hd { top: 5vh; } #nav { top: 36vh; } }
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<canvas id=cp></canvas>
<div id=hud><pre id=i></pre><p id=t></p><p id=wm></p><p id=rd></p><i id=x></i><div id=hf></div></div>
<div id=ld>
  <h1>Stellar Garden</h1><div id=p><i id=b></i></div><p id=s>Charting the stars…</p><p id=w hidden>Use Google Chrome or Edge for the best experience</p>
</div>
<div id=m>
  <div id=hd><h1>Stellar Garden</h1><p id=sub>EXPLORE • DISCOVER • SURVIVE</p></div>
  <nav id=nav></nav>
  <div id=ver>BUILD 0.3 · WEBGPU</div>
  <div id=hint></div>
</div>
<div id=pn></div>
<button id=o>MENU</button>
<div id=fw><div><h1>Safe travels, pilot</h1><p>THE STARS WILL WAIT</p><button id=fb>Return to the cockpit</button></div></div>
<script>
/*SCRIPT*/
</script>
</body>
</html>
